<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好算生活 · 预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="brand">好算生活</div>
      <div class="sub">把日常账算清楚，把关键日记明白</div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-panel="tools">工具</button>
      <button class="tab" data-panel="countdown">倒数日</button>
      <button class="tab" data-panel="mortgage">房贷</button>
      <button class="tab" data-panel="relative">亲戚</button>
    </nav>

    <main>
      <section id="panel-tools" class="panel active">
        <div class="search">搜工具：房贷、个税、退休、亲戚称呼…</div>
        <div class="chips">
          <span>房贷计算</span><span>个税计算</span><span>退休年龄</span><span>亲戚称呼</span>
        </div>
        <h2>热门工具</h2>
        <div class="grid" id="tool-grid"></div>
      </section>

      <section id="panel-countdown" class="panel">
        <h2>倒数日</h2>
        <form id="cd-form" class="card form">
          <label>标题 <input id="cd-title" value="高考" /></label>
          <label>日期 <input id="cd-date" type="date" /></label>
          <button type="submit">添加</button>
        </form>
        <div id="cd-list"></div>
      </section>

      <section id="panel-mortgage" class="panel">
        <h2>房贷计算器</h2>
        <form id="mortgage-form" class="card form">
          <label>贷款金额（万元） <input id="m-amount" value="100" /></label>
          <label>年限（年） <input id="m-years" value="30" /></label>
          <label>年利率（%） <input id="m-rate" value="3.5" /></label>
          <label>方式
            <select id="m-method">
              <option value="equalPayment">等额本息</option>
              <option value="equalPrincipal">等额本金</option>
            </select>
          </label>
          <button type="submit">开始计算</button>
        </form>
        <div id="m-result" class="result hidden"></div>
      </section>

      <section id="panel-relative" class="panel">
        <h2>亲戚称呼</h2>
        <div class="card form">
          <div id="rel-path" class="path">我</div>
          <div id="rel-options" class="options"></div>
          <div class="row">
            <button type="button" id="rel-back">回退</button>
            <button type="button" id="rel-reset">清空</button>
            <button type="button" id="rel-calc">算出称呼</button>
          </div>
        </div>
        <div id="rel-result" class="result hidden"></div>
      </section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
