<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>好算生活 · 预览</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="brand">好算生活</div>
      <div class="sub">把日常账算清楚，把关键日记明白</div>
    </header>

    <nav class="tabs">
      <a class="tab active" href="#tools" data-panel="tools">工具</a>
      <a class="tab" href="#countdown" data-panel="countdown">倒数日</a>
      <a class="tab" href="#mortgage" data-panel="mortgage">房贷</a>
      <a class="tab" href="#relative" data-panel="relative">亲戚</a>
    </nav>

    <main>
      <section id="panel-tools" class="panel active">
        <div class="search"><span class="search-dot"></span><span>搜索房贷、个税、退休、亲戚称呼…</span></div>
        <div class="chips">
          <span>房贷计算</span><span>个税计算</span><span>退休年龄</span><span>亲戚称呼</span>
        </div>
        <div class="continue">
          <div><div class="kicker">继续上次</div><strong>房贷计算器</strong></div>
          <div class="cta">打开 ›</div>
        </div>
        <h2>常用工具</h2>
        <div class="list" id="tool-list"></div>
      </section>

      <section id="panel-countdown" class="panel">
        <div class="focus" id="cd-focus"></div>
        <form id="cd-form" class="card form">
          <label>标题 <input id="cd-title" value="旅行" /></label>
          <label>日期 <input id="cd-date" type="date" /></label>
          <button type="submit">添加倒数日</button>
        </form>
        <div id="cd-list"></div>
      </section>

      <section id="panel-mortgage" class="panel">
        <h2>房贷计算器</h2>
        <form id="mortgage-form" class="card form">
          <label>贷款金额（万元） <input id="m-amount" value="100" /></label>
          <label>年限（年） <input id="m-years" value="30" /></label>
          <label>年利率（%） <input id="m-rate" value="3.5" /></label>
          <label>方式
            <select id="m-method">
              <option value="equalPayment">等额本息</option>
              <option value="equalPrincipal">等额本金</option>
            </select>
          </label>
          <button type="submit">开始计算</button>
        </form>
        <div id="m-result" class="result hidden"></div>
      </section>

      <section id="panel-relative" class="panel rel-panel">
        <div class="rel-step-bar" id="rel-step-bar"></div>
        <div class="rel-chain-wrap" id="rel-chain"></div>
        <div class="rel-outcome" id="rel-outcome"></div>
        <div id="rel-sheet"></div>
        <div class="rel-footer">
          <button type="button" id="rel-share" class="rel-share-btn" disabled>分享称呼结果</button>
          <div class="rel-footer-links">
            <button type="button" class="rel-link" id="rel-back">回退一步</button>
            <span class="rel-link-sep">·</span>
            <button type="button" class="rel-link" id="rel-reset">重新开始</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
